name: gestionale-affitti

services:
  app:
    image: node:24.21.0-alpine3.24
    working_dir: /workspace
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    env_file:
      - .env
    environment:
      NODE_PATH: /workspace/node_modules
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  node_modules:
  mysql_data:
