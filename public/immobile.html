<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuovo immobile — Gestionale Affitti</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/layout.js"></script>
</head>
<body data-menu="private" data-page-script="/js/immobile.js">
  <header id="site-header" class="site-header"></header>
  <main class="container immobili-page">
    <div class="content-column">
      <p id="session-message" class="message" role="status" aria-live="polite">Verifica della sessione in corso…</p>
      <button id="session-retry" class="action-right" type="button" hidden>Riprova accesso</button>

      <div id="protected-content" hidden>
        <section class="status-card" aria-labelledby="form-title">
          <h1 id="form-title">Nuovo immobile</h1>
          <p>I campi contrassegnati con * sono obbligatori. URL immagine e dati catastali sono facoltativi.</p>

          <form id="immobile-form" novalidate>
            <fieldset id="form-fields" disabled>
              <section aria-labelledby="address-title">
                <h2 id="address-title">Indirizzo</h2>
                <div id="indirizzo-fields"></div>
              </section>

              <div class="field">
                <label for="immagineUrl">URL immagine (facoltativo)</label>
                <input id="immagineUrl" name="immagineUrl" type="url" maxlength="500" aria-describedby="immagineUrl-error">
                <p class="field-error" id="immagineUrl-error"></p>
              </div>

              <section aria-labelledby="cadastral-title">
                <hr>
                <h2 id="cadastral-title">Dati catastali</h2>
                <p class="field-hint">Facoltativi in questa pagina. I campi necessari al contratto verranno richiesti quando servono.</p>
                <div id="dati-catastali-fields"></div>
              </section>

              <div class="actions form-actions">
                <button id="cancel-immobile" class="button-secondary" type="button">Cancella</button>
                <button id="save" class="action-primary" type="submit">Crea immobile</button>
              </div>
            </fieldset>
          </form>

          <p id="form-message" class="message" role="status" aria-live="polite" tabindex="-1"></p>
          <button id="detail-retry" class="action-right" type="button" hidden>Riprova caricamento immobile</button>
        </section>
      </div>

      <noscript><p>Abilita JavaScript nel browser per gestire gli immobili.</p></noscript>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
