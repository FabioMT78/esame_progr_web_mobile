<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi — Gestionale Affitti</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/layout.js"></script>
</head>
<body data-menu="public" data-page-script="/js/login.js">
  <header id="site-header" class="site-header"></header>
  <main class="container">
    <div class="content-column">
      <section class="status-card" aria-labelledby="login-title">
        <h1 id="login-title">Accedi alla tua area riservata</h1>
        <p>Benvenuto in Gestionale Affitti. Accedi con il tuo account proprietario.</p>
        <form id="login-form" method="post" action="/api/auth/login">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="username" maxlength="255" aria-describedby="email-error" value="fabio.pubbl@hotmail.com">
            <small class="field-error" id="email-error"></small>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" maxlength="128" aria-describedby="password-error" value="CiccioPasticcio_123">
            <small class="field-error" id="password-error"></small>
          </div>
          <div class="actions form-actions">
            <button class="action-primary" type="submit">Accedi</button>
          </div>
        </form>
        <p id="form-message" class="message" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p>
        <p>Non hai un account? <a href="/proprietario.html">Registrati come proprietario</a>.</p>
      </section>
      <noscript><p>Abilita JavaScript nel browser per utilizzare l'autenticazione.</p></noscript>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
